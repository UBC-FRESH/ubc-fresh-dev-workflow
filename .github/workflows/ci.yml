name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types (mypy --strict)
        run: python -m mypy

      - name: Tests with coverage gate
        run: python -m pytest

      - name: Validate workflow surfaces
        run: python scripts/check_workflow.py

      - name: Build docs with warnings as errors
        run: sphinx-build -b html docs _build/html -W

      - name: Dogfood the seed
        run: |
          python scripts/new_project.py --name "CI Demo" --slug ci-demo --dest "$RUNNER_TEMP/ci-demo"
          cd "$RUNNER_TEMP/ci-demo"
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m pytest
          python scripts/check_workflow.py

  dashboard:
    name: Green dashboard summary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the dashboard
        shell: bash
        run: |
          set +e
          python scripts/dashboard.py --markdown --json runtime/dashboard.json > dashboard.md
          status=$?
          cat dashboard.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the dashboard record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-record
          path: runtime/dashboard.json

  pre-commit:
    name: Pre-commit parity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure
